apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-platform-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tamal-tm/sre-platform-manifests.git
    targetRevision: main
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: sre-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
