apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: sre-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: tamal23/service-a:v1-metrics
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: service-a-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
